<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="chart-clip">
      <rect x="14" y="24" width="72" height="52" rx="2"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#020617"/>
  <rect width="100" height="100" rx="22" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Grid lines -->
  <g clip-path="url(#chart-clip)" stroke="rgba(255,255,255,0.06)" stroke-width="0.8">
    <line x1="14" y1="41" x2="86" y2="41"/>
    <line x1="14" y1="58" x2="86" y2="58"/>
    <line x1="32" y1="24" x2="32" y2="76"/>
    <line x1="50" y1="24" x2="50" y2="76"/>
    <line x1="68" y1="24" x2="68" y2="76"/>
  </g>

  <!-- Area fill -->
  <polygon
    points="14,76 14,58 26,52 38,44 50,36 62,40 74,30 86,26 86,76"
    fill="url(#areaGrad)"
    clip-path="url(#chart-clip)"/>

  <!-- Line -->
  <polyline
    points="14,58 26,52 38,44 50,36 62,40 74,30 86,26"
    fill="none"
    stroke="url(#lineGrad)"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
    clip-path="url(#chart-clip)"/>

  <!-- Data points -->
  <g fill="#f59e0b" filter="url(#glow)" clip-path="url(#chart-clip)">
    <circle cx="26" cy="52" r="2.5"/>
    <circle cx="38" cy="44" r="2.5"/>
    <circle cx="50" cy="36" r="2.5"/>
    <circle cx="62" cy="40" r="2.5"/>
    <circle cx="74" cy="30" r="2.5"/>
  </g>

  <!-- Axis baseline -->
  <line x1="14" y1="76" x2="86" y2="76" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
</svg>
