<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — OMA Concepts</title>
  <meta name="theme-color" content="#020617">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617; color: #f8fafc;
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    .num {
      font-family: 'DM Serif Display', serif;
      font-size: 120px; line-height: 1;
      color: #f59e0b; opacity: 0.3;
      margin-bottom: 16px;
    }
    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 36px; margin-bottom: 12px;
    }
    p { font-size: 16px; color: #94a3b8; margin-bottom: 36px; }
    a {
      display: inline-flex; align-items: center; gap: 8px;
      background: #f59e0b; color: #000;
      font-weight: 700; font-size: 15px;
      padding: 14px 28px; border-radius: 10px;
      text-decoration: none;
      transition: background 0.2s;
    }
    a:hover { background: #fbbf24; }
  </style>
</head>
<body>
  <div class="num">404</div>
  <h1>Page not found.</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a href="/">Back to OMA Concepts &#8594;</a>
</body>
</html>
